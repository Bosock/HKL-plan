name: Deploy HKL-Plan

# Baut und deployt die App bei jedem Push auf main automatisch auf den Server
# (151.80.56.152) hinter den bestehenden nginx-proxy + letsencrypt-companion.
# Zugangsdaten kommen aus den Repository-Secrets SSH_HOST / SSH_USER / SSH_KEY.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hkl
  cancel-in-progress: false

jobs:
  # 1) Syntaxprüfung des Backends + Test-Suite (kein Deploy).
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backend-Syntax prüfen
        run: node --check server.js
      - name: Tests ausführen
        run: npm test

  # 2) Deploy nur auf main (nicht bei workflow_dispatch aus Feature-Branches nötig,
  #    läuft aber auch dort auf Wunsch). Zieht den aktuellen Stand per git auf den
  #    Server und startet den Container via docker compose neu.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Prüfen, ob SSH-Secrets gesetzt sind
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -z "$SSH_HOST" ]; then
            echo "::error::Repository-Secrets SSH_HOST/SSH_USER/SSH_KEY fehlen. Deploy übersprungen."
            exit 1
          fi

      - name: Auf Server deployen (git pull + docker compose)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -e
            REPO=https://github.com/Bosock/HKL-plan.git
            APP=~/server/hkl
            mkdir -p ~/server
            if [ ! -d "$APP/.git" ]; then
              rm -rf "$APP"
              git clone --depth 1 "$REPO" "$APP"
            fi
            cd "$APP"
            git fetch --depth 1 origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
            # Deploy verifizieren: warten, bis der Container /api/health beantwortet.
            # Antwortet er nicht (Server startet nicht / Crash-Loop), muss die
            # Pipeline rot werden statt still einen kaputten Stand als Erfolg zu melden.
            echo "Warte auf /api/health von hkl-plan ..."
            ok=0
            for i in $(seq 1 30); do
              if docker exec hkl-plan wget -qO- "http://127.0.0.1:4180/api/health" >/dev/null 2>&1; then
                echo "hkl-plan antwortet auf /api/health (Versuch $i)."
                ok=1
                break
              fi
              echo "  [$i/30] noch nicht bereit ..."
              sleep 2
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::hkl-plan antwortet nach 60s nicht auf /api/health — Deploy fehlgeschlagen."
              docker logs --tail 50 hkl-plan || true
              exit 1
            fi
            # Zusätzlich den Docker-Health-Status informativ protokollieren.
            docker inspect --format 'Docker-Health: {{.State.Health.Status}}' hkl-plan || true
